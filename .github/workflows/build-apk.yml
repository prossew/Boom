name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      ANDROID_API: "34"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Установка .NET Android workload и Android SDK
        shell: pwsh
        run: |
          dotnet workload install android
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk) { throw "ANDROID_SDK_ROOT и ANDROID_HOME не заданы" }
          $mgr = (Get-Command sdkmanager.bat -ErrorAction Stop).Source
          "y`n" * 20 | & $mgr --licenses | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Не удалось принять лицензии Android SDK" }
          & $mgr "platforms;android-$env:ANDROID_API" "build-tools;34.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Не удалось установить Android API $env:ANDROID_API" }

      - name: NuGet restore
        run: dotnet restore AppRequests.Android/AppRequests.Android.csproj

      - name: Создание ключа подписи
        shell: pwsh
        run: |
          keytool -genkeypair -v -keystore ci.keystore -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=AppRequests"
          if ($LASTEXITCODE -ne 0) { throw "Не удалось создать ключ подписи" }

      - name: Сборка подписанного APK
        shell: pwsh
        run: |
          $keystore = Join-Path $PWD "ci.keystore"
          dotnet publish AppRequests.Android/AppRequests.Android.csproj `
            --configuration Release `
            --framework net8.0-android34.0 `
            -p:AndroidPackageFormat=apk `
            -p:EmbedAssembliesIntoApk=true `
            -p:AndroidKeyStore=true `
            "-p:AndroidSigningKeyStore=$keystore" `
            -p:AndroidSigningStorePass=android123 `
            -p:AndroidSigningKeyAlias=appkey `
            -p:AndroidSigningKeyPass=android123
          if ($LASTEXITCODE -ne 0) { throw "Сборка APK завершилась с ошибкой" }
          $apk = Get-ChildItem "AppRequests.Android/bin/Release/net8.0-android34.0/publish" -Filter "*-Signed.apk" -ErrorAction SilentlyContinue
          if (-not $apk) { throw "Подписанный APK не найден в каталоге publish" }
          $apk | ForEach-Object { Write-Host "Создан APK: $($_.FullName)" }

      - uses: actions/upload-artifact@v4
        with:
          name: AppRequests-apk
          path: AppRequests.Android/bin/Release/net8.0-android34.0/publish/*-Signed.apk
          if-no-files-found: error
